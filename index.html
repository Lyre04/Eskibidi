<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sayang! 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff8fa3;
            --soft-peach: #fff5eb;
            --accent-gold: #e6b800;
            --glass: rgba(255, 255, 255, 0.85);
            --text: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background-color: var(--soft-peach);
            color: var(--text);
            overflow-x: hidden;
        }

        /* --- Landing / Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(180deg, #fff0f3 0%, var(--soft-peach) 100%);
            position: relative;
        }

        .hero h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 10vw, 5rem);
            color: var(--primary-pink);
            margin-bottom: 10px;
            z-index: 2;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.8;
            z-index: 2;
        }

        .start-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1rem;
            background: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 143, 163, 0.4);
            transition: transform 0.3s;
            z-index: 10;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        /* --- Letter Section --- */
        .content-section {
            min-height: 100vh;
            padding: 80px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .letter-container {
            max-width: 800px;
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: clamp(30px, 8vw, 60px);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .typing-text {
            font-size: 1.1rem;
            line-height: 2;
            min-height: 200px;
        }

        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--primary-pink);
            text-align: right;
            margin-top: 40px;
            opacity: 0;
            transition: opacity 1s;
        }

        /* --- Wishes Grid --- */
        .wishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }

        .wish-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            transition: transform 0.3s;
        }

        .wish-card:hover { transform: translateY(-5px); }
        .wish-card i { font-size: 2rem; display: block; margin-bottom: 10px; }

        /* --- Floating Elements --- */
        .floating {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: float-up 5s linear infinite;
            opacity: 0.6;
        }

        @keyframes float-up {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .gif-decoration {
            width: 150px;
            position: absolute;
            bottom: 20px;
        }

        .left { left: 5%; }
        .right { right: 5%; }

        @media (max-width: 600px) {
            .gif-decoration { width: 80px; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://litter.catbox.moe/r5tnphbd60ccuyl6.mp3" type="audio/mpeg">
    </audio>

    <section class="hero" id="home">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56Z3Y5bnY5bnY5bnY5bnY5bnY5bnY5bnY5bnY5bnY5bnY5bnY5bnZ6JmVwPXYxX2dpZnNfc2VhcmNoJmN0PWc/g5R96zhGrLcmis9md6/giphy.gif" class="gif-decoration left" alt="party">
        <h1>Happy Birthday, Sayang!</h1>
        <p>A little space on the internet just for you.</p>
        <button class="start-btn" onclick="startExperience()">Open Your Surprise</button>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcW8xd3Z6Nms5bXAzYmR6Znl3ZzN3Znl3ZzN3Znl3ZzN3Znl3ZzN3ZmxvJmVwPXYxX2dpZnNfc2VhcmNoJmN0PWc/KZG3HjhDZPiMGkh3xm/giphy.gif" class="gif-decoration right" alt="cake">
    </section>

    <section class="content-section" id="letter">
        <div class="letter-container">
            <div id="text" class="typing-text"></div>
            <div id="signature" class="signature">— Your Favorite Person ❤️</div>
            
            <div class="wishes-grid">
                <div class="wish-card"><i>🎂</i><strong>Stay Happy</strong><p>I hope your smile never fades away.</p></div>
                <div class="wish-card"><i>✨</i><strong>Stay Bright</strong><p>May you achieve all your biggest dreams.</p></div>
                <div class="wish-card"><i>❤</i><strong>Stay With Me</strong><p>To many more birthdays together.</p></div>
            </div>
        </div>
    </section>

    <script>
        const messageText = `To my dearest Sayang,

Today is all about you! I wanted to create something special that shows how much you mean to me. 

Happy Birthday! 🥳 You are the most incredible, kind, and beautiful person I know. Thank you for making my world so much brighter just by being in it.

I hope this website brings a smile to your face. I wish for you a year filled with success, laughter, and all the things that make you happy. I'm always here to support you and cheer you on!

I love you more than words can say. ❤️`;

        function startExperience() {
            // Play Music
            const music = document.getElementById("bgMusic");
            music.play();
            
            // Scroll to letter
            document.getElementById('letter').scrollIntoView({ behavior: 'smooth' });
            
            // Start typing
            setTimeout(typeMessage, 800);
            
            // Hide the button so they don't click twice
            document.querySelector('.start-btn').style.display = 'none';
        }

        let charIndex = 0;
        function typeMessage() {
            if (charIndex < messageText.length) {
                let char = messageText.charAt(charIndex);
                document.getElementById("text").innerHTML += char === "\n" ? "<br>" : char;
                charIndex++;
                setTimeout(typeMessage, 35);
            } else {
                document.getElementById("signature").style.opacity = "1";
            }
        }

        function createFloatingIcon() {
            const icons = ["❤", "✨", "🎂", "🎈", "🌸"];
            const item = document.createElement("div");
            item.classList.add("floating");
            item.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            item.style.left = Math.random() * 100 + "vw";
            item.style.fontSize = Math.random() * 20 + 15 + "px";
            item.style.animationDuration = Math.random() * 3 + 4 + "s";
            document.body.appendChild(item);
            setTimeout(() => item.remove(), 6000);
        }
        setInterval(createFloatingIcon, 500);
    </script>
</body>
</html>
